name: build

# Build the SDL3 cross-platform app on macOS, Linux, and Windows. On a version
# tag (v*) the artifacts are attached to a GitHub Release.
#
# NOTE: this is the first iteration of the CI and is expected to need tuning
# against real runner output (especially Linux SDL3-from-source build deps and
# the Windows toolchain). The macOS path mirrors the locally-verified build.

# Builds run on version tags (they make the Release) and when started by hand
# (Actions > build > Run workflow), not on every push.
#
# A version tag makes a DRAFT release: the packages are attached, but nothing is
# visible to the public until someone has looked at them and published the
# draft (Releases > the draft > Publish, or `gh release edit <tag> --draft=false`).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      macos:
        description: 'Build the macOS package too (macOS minutes count ten times)'
        type: boolean
        default: true

# A newer run of the same ref replaces an older one that is still waiting.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # A manual run can leave the macOS package out (see the input above).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    # macos-15, not macos-latest: the libraries that go into the app come from
    # Homebrew and need the macOS they were built for, or a newer one. Building
    # on the oldest macOS Homebrew still supports keeps the app usable there.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # libslirp is the network of the Uthernet II card; without it the build
        # falls back to a card with no network.
        run: brew install cmake ninja sdl3 libslirp pkgconf
      - name: Configure
        run: |
          ARGS=""
          case "$GITHUB_REF" in
            refs/tags/v*) ARGS="-DGSPLUS_VERSION=${GITHUB_REF_NAME#v}" ;;
          esac
          cmake -G Ninja -B build -S emubuddy/src $ARGS
      - name: Build
        run: cmake --build build --target gsplus-sdl emubuddy-launcher
      - name: Test the Launcher
        run: |
          cmake --build build --target test_profile test_library test_attract test_jpeg test_lang
          ./build/launcher/test_profile
          ./build/launcher/test_library
          ./build/launcher/test_attract
          ./build/launcher/test_jpeg
          ./build/launcher/test_lang
      - name: Package (.dmg)
        run: cd build && cpack
      - name: Start test (the apps from the .dmg)
        # The programs must start from the package alone: no library from
        # Homebrew, no screen, no ROM. EmuBuddy then shows its "ROM Required"
        # window; both programs save a picture of what they drew and quit.
        run: |
          mkdir -p smoke/home smoke/cfg smoke/share smoke/profiles
          hdiutil attach build/*.dmg -nobrowse -readonly -mountpoint /tmp/emubuddy-dmg
          cp -R /tmp/emubuddy-dmg/EmuBuddy.app "/tmp/emubuddy-dmg/EmuBuddy Launcher.app" smoke/
          hdiutil detach /tmp/emubuddy-dmg
          cd smoke
          if otool -L EmuBuddy.app/Contents/MacOS/EmuBuddy EmuBuddy.app/Contents/Frameworks/*.dylib \
              "EmuBuddy Launcher.app/Contents/MacOS/EmuBuddy Launcher" | grep -E "/opt/homebrew|/usr/local"; then
            echo "the app still uses a library from outside its own folder"; exit 1
          fi
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy HOME=$PWD/home
          export EMUBUDDY_NOGATEWAY=1 EMUBUDDY_NOHELPER=1 EMUBUDDY_AUTOSHARE_DIR=$PWD/share
          EMUBUDDY_SNAPSHOT=$PWD/emubuddy.bmp EMUBUDDY_SNAPFRAME=60 \
            perl -e 'alarm 120; exec @ARGV' EmuBuddy.app/Contents/MacOS/EmuBuddy -cfg $PWD/cfg/emubuddy.config
          test -s emubuddy.bmp
          EMUBUDDY_PROFILES=$PWD/profiles LAUNCHER_SHOT=$PWD/launcher.bmp \
            perl -e 'alarm 120; exec @ARGV' "EmuBuddy Launcher.app/Contents/MacOS/EmuBuddy Launcher"
          test -s launcher.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: start-test-macos
          path: smoke/*.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: emubuddy-macos
          path: build/*.dmg

  linux:
    # One build per CPU architecture. ubuntu-24.04-arm is a native arm64 runner
    # (free for public repos), so the ARM build needs no cross-compiling — the
    # identical steps just run on ARM hardware. CPack stamps the architecture
    # into the tarball name (Linux-x86_64 / Linux-aarch64) so the two release
    # assets don't collide.
    strategy:
      fail-fast: false        # one architecture failing must not hide the other
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools + SDL3 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential git \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libsndio-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev \
            pkg-config libslirp-dev
      - name: Configure (SDL3 built from source via FetchContent)
        run: |
          ARGS=""
          case "$GITHUB_REF" in
            refs/tags/v*) ARGS="-DGSPLUS_VERSION=${GITHUB_REF_NAME#v}" ;;
          esac
          cmake -G Ninja -B build -S emubuddy/src $ARGS
      - name: Build
        run: cmake --build build --target gsplus-sdl emubuddy-launcher
      - name: Collect the libraries for the download
        # SDL3 (built above) and libslirp go into the archive, next to the
        # programs, which look for libraries in their own folder first.
        run: |
          mkdir -p build/bundle
          ldd build/EmuBuddy
          ldd build/EmuBuddy | awk '/libSDL3|libslirp/ {print $3}' | xargs -I{} cp -L {} build/bundle/
          ls -la build/bundle
          test -f build/bundle/libSDL3.so.0
          ls build/bundle/libslirp.so.*
      - name: Package (.tar.gz)
        run: cd build && cpack
      - name: Start test (the programs from the archive)
        # Unpack the archive somewhere else and start both programs without a
        # screen and without a ROM. SDL3 and libslirp must come from the archive.
        run: |
          mkdir -p smoke && tar xzf build/*.tar.gz -C smoke
          cd smoke
          mkdir -p home cfg share profiles
          ldd ./EmuBuddy | tee ldd.txt
          if grep -q "not found" ldd.txt; then echo "a library is missing"; exit 1; fi
          grep -q "$PWD/libSDL3.so.0" ldd.txt
          grep -q "$PWD/libslirp.so.0" ldd.txt
          ./EmuBuddy -help | head -3
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy HOME=$PWD/home XDG_DATA_HOME=$PWD/home/data
          export EMUBUDDY_NOGATEWAY=1 EMUBUDDY_NOHELPER=1 EMUBUDDY_AUTOSHARE_DIR=$PWD/share
          EMUBUDDY_SNAPSHOT=$PWD/emubuddy.bmp EMUBUDDY_SNAPFRAME=60 \
            timeout 120 ./EmuBuddy -cfg $PWD/cfg/emubuddy.config
          test -s emubuddy.bmp
          EMUBUDDY_PROFILES=$PWD/profiles LAUNCHER_SHOT=$PWD/launcher.bmp timeout 120 ./EmuBuddy-Launcher
          test -s launcher.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: start-test-linux-${{ matrix.arch }}
          path: smoke/*.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: emubuddy-linux-${{ matrix.arch }}
          path: build/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64, not MINGW64: MSYS2 offers libslirp only for the newer
          # environments. Programs built here need Windows 10 or newer.
          msystem: UCRT64
          update: true
          # No SDL3 package here: it may be unavailable under that exact name,
          # and FetchContent builds SDL3 from source (as the Linux job does),
          # so we only need the gcc/cmake/ninja toolchain.
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libslirp
      - name: Configure (SDL3 built from source via FetchContent)
        run: |
          ARGS=""
          case "$GITHUB_REF" in
            refs/tags/v*) ARGS="-DGSPLUS_VERSION=${GITHUB_REF_NAME#v}" ;;
          esac
          cmake -G Ninja -B build -S emubuddy/src $ARGS
      - name: Build
        run: cmake --build build --target gsplus-sdl emubuddy-launcher
      - name: Collect the DLLs for the download
        # Everything the programs load from MSYS2 (the MinGW runtime, libslirp
        # and what it needs) goes into the .zip, so it runs on a plain Windows.
        run: |
          mkdir -p build/bundle
          for exe in build/EmuBuddy.exe build/launcher/EmuBuddy-Launcher.exe; do
            ls -la "$exe"
            ldd "$exe" | awk '$3 ~ /^\/ucrt64\// {print $3}'
          done | grep '^/ucrt64/' | sort -u | xargs -I{} cp {} build/bundle/
          ls -la build/bundle
          ls build/bundle/libslirp*.dll
      - name: Package (.zip)
        run: cd build && cpack
      - name: Start test (the programs from the .zip, as on a plain Windows)
        # PowerShell, not the MSYS2 shell, and nothing but the Windows folders in
        # the search path: every DLL has to come from the unpacked .zip. Both
        # programs start without a screen and without a ROM, save a picture of
        # what they drew and quit.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem build\*.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath smoke
          Set-Location smoke
          New-Item -ItemType Directory -Force appdata, cfg, share, profiles | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:SDL_VIDEODRIVER = 'dummy'
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:APPDATA = "$PWD\appdata"
          $env:EMUBUDDY_NOGATEWAY = '1'
          $env:EMUBUDDY_NOHELPER = '1'
          $env:EMUBUDDY_AUTOSHARE_DIR = "$PWD\share"
          function Start-AndWait($exe, $arguments, $picture) {
            if ($arguments) { $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -NoNewWindow }
            else { $p = Start-Process -FilePath $exe -PassThru -NoNewWindow }
            $null = $p.Handle                     # keeps the exit code readable
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe did not finish" }
            if ($p.ExitCode -ne 0) { throw "$exe ended with code $($p.ExitCode)" }
            if (-not (Test-Path $picture)) { throw "$exe drew no picture" }
            Write-Host "$exe started, drew a picture and quit"
          }
          $env:EMUBUDDY_SNAPSHOT = "$PWD\emubuddy.bmp"
          $env:EMUBUDDY_SNAPFRAME = '60'
          Start-AndWait "$PWD\EmuBuddy.exe" @('-cfg', "$PWD\cfg\emubuddy.config") 'emubuddy.bmp'
          $env:EMUBUDDY_PROFILES = "$PWD\profiles"
          $env:LAUNCHER_SHOT = "$PWD\launcher.bmp"
          Start-AndWait "$PWD\EmuBuddy-Launcher.exe" $null 'launcher.bmp'
      - uses: actions/upload-artifact@v7
        with:
          name: start-test-windows
          path: smoke/*.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: emubuddy-windows
          path: build/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ macos, linux, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required for the token to create a Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: emubuddy-*      # the packages only, not the pictures of the start tests
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          # Derive the release flags from the tag name: a plain version tag
          # (v1.0.0) is a full release and becomes "Latest"; a pre-release tag
          # carrying a suffix (v1.0.0-beta1, -alpha0, -rc1) stays a pre-release
          # and is never marked Latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          draft: true
          generate_release_notes: true
